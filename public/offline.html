<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iTrip — آفلاین</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, #0e6f6a, #07403f);
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 420px; }
      svg { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.9; color: #cfe8e4; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 28px;
        font-size: 14px;
        font-weight: 800;
        background: #fffdf9;
        color: #075b5a;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
        <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" />
      </svg>
      <h1>اتصال اینترنت قطع است</h1>
      <p>
        صفحه‌های بازدیدشده اخیر و نقشه‌های ذخیره‌شده در دسترس هستند؛ برای جستجو و رزرو جدید به اینترنت نیاز داریم.
      </p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
