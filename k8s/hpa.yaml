apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firuzo-app-hpa
  labels:
    app.kubernetes.io/name: firuzo-platform
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firuzo-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
