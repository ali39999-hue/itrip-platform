apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firuzo-ingress
  labels:
    app.kubernetes.io/name: firuzo-platform
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - firuzo.com
        - www.firuzo.com
      secretName: firuzo-tls-cert
  rules:
    - host: firuzo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firuzo-service
                port:
                  number: 80
    - host: www.firuzo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firuzo-service
                port:
                  number: 80
