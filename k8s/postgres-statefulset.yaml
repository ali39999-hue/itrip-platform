apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firuzo-postgres
  labels:
    app.kubernetes.io/name: firuzo-platform
    app.kubernetes.io/component: database
spec:
  serviceName: firuzo-postgres
  replicas: 1
  selector:
    matchLabels:
      app: firuzo-postgres
  template:
    metadata:
      labels:
        app: firuzo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firuzo-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "itrip"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "pg_isready -U postgres -d itrip"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "pg_isready -U postgres -d itrip"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: firuzo-postgres
  labels:
    app.kubernetes.io/name: firuzo-platform
    app.kubernetes.io/component: database
spec:
  ports:
    - port: 5432
      name: postgres
      targetPort: 5432
  clusterIP: None
  selector:
    app: firuzo-postgres
