services:
  db:
    image: postgres:16-alpine
    container_name: firuzo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test_dummy_db_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-itrip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-itrip}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - firuzo-network

  redis:
    image: redis:7-alpine
    container_name: firuzo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - firuzo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: firuzo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:-test_dummy_db_password_2026}@${DB_HOST:-db}:5432/${POSTGRES_DB:-itrip}?schema=public
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=true
      - DEMO_MODE=${DEMO_MODE:-false}
      - NEXT_PUBLIC_DEMO_MODE=${NEXT_PUBLIC_DEMO_MODE:-false}
      - GATEWAY_MODE=${GATEWAY_MODE:-internal_wallet}
      - BALE_BOT_TOKEN=${BALE_BOT_TOKEN}
      - NEXT_PUBLIC_BALE_BOT_USERNAME=${NEXT_PUBLIC_BALE_BOT_USERNAME}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMSWBS_USERNAME=${SMSWBS_USERNAME}
      - SMSWBS_PASSWORD=${SMSWBS_PASSWORD}
      - SMSWBS_SENDER=${SMSWBS_SENDER}
      - SMS_PROVIDER=${SMS_PROVIDER:-smswbs}
      - SMS_SENDER_LINE=${SMS_SENDER_LINE}
      - SMS_OTP_LINE=${SMS_OTP_LINE}
      - SMS_PATTERN_CODE=${SMS_PATTERN_CODE}
      - ECARDO_BASE_URL=${ECARDO_BASE_URL:-https://ecardo.ir}
      - ECARDO_PUBLIC_KEY=${ECARDO_PUBLIC_KEY}
      - ECARDO_SECRET_KEY=${ECARDO_SECRET_KEY}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - firuzo-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: firuzo-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${DB_PASSWORD:-test_dummy_db_password_2026}@${DB_HOST:-db}:5432/${POSTGRES_DB:-itrip}?schema=public
      - REDIS_URL=redis://${REDIS_HOST:-redis}:6379
      - AUTH_SECRET=${AUTH_SECRET}
      - DEMO_MODE=${DEMO_MODE:-false}
      - GATEWAY_MODE=${GATEWAY_MODE:-internal_wallet}
      - BALE_BOT_TOKEN=${BALE_BOT_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - SKIP_DB_MIGRATION=true
    networks:
      - firuzo-network

  adminer:
    image: adminer:latest
    container_name: firuzo-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    profiles:
      - tools
      - dev
    networks:
      - firuzo-network

volumes:
  postgres_data:
    name: firuzo_postgres_data
  redis_data:
    name: firuzo_redis_data

networks:
  firuzo-network:
    name: firuzo-network
    driver: bridge
