name: Production Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Test-only credentials are injected via GitHub Actions secrets with CI-local
# fallbacks. Never commit real production credentials to this repository.
env:
  DATABASE_URL: postgresql://itrip_user:itrip_secure_password@localhost:5432/itrip_test_db
  AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci_only_dummy_secret_32_chars_min' }}
  ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'Admin@Firuzo2026!Secure' }}
  USER_PASSWORD: ${{ secrets.CI_USER_PASSWORD || 'User@Firuzo2026!Secure' }}
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "false"
      NEXT_PUBLIC_DEMO_MODE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'itrip_secure_password' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets Scan (SEC-009 / CI-009)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: UI/UX AGENTS.md Audit (GATE-001)
        run: npm run gate:uiux

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Validate Prisma Database Migrations
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Schema Drift Check (CI-014)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Execute Unit & Financial Invariant Tests
        run: npm run test:unit

      - name: Next.js Production Build (demo disabled)
        env:
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        # QR-002: record the REAL measured outcome. If the build fails, the
        # step exits non-zero AND the record lands as fail.
        run: |
          if npm run build; then
            node scripts/record-gate-result.mjs build pass -- "CI production build"
          else
            node scripts/record-gate-result.mjs build fail -- "CI production build"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Runtime gates. These REQUIRE a server, which is why they were missing
      # from CI before: they are now wired honestly (server started here, and
      # playwright.config reuses it instead of fighting over port 3000).
      # ---------------------------------------------------------------------
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Start production server for runtime gates
        env:
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: |
          nohup npm start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health/live > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready in time"
          cat /tmp/next-start.log
          exit 1

      - name: Accessibility Gate (A11Y-002) — blocking
        run: npm run gate:a11y

      - name: Responsive journey gate 320→768 (RESP-001) — blocking
        run: npx playwright test tests/responsive-journeys.spec.ts --project=chromium

      - name: E2E evidence for quality report (golden journeys, desktop chromium)
        # QR-001 deadlock fix: this job OWNS results/e2e.json because the
        # fail-closed quality report below refuses not-run/missing records.
        # The e2e-gate job keeps running golden journeys (desktop + mobile) as
        # an independent gate AFTER this job passes.
        run: |
          if npx playwright test tests/golden-journeys.spec.ts --project=chromium; then
            node scripts/record-gate-result.mjs e2e pass -- "audit-job golden journeys (desktop chromium)"
          else
            node scripts/record-gate-result.mjs e2e fail -- "audit-job golden journeys (desktop chromium)"
            exit 1
          fi

      - name: Generate machine-readable quality report
        # QR-002: no injected pass. Build/e2e statuses must come from evidence
        # files written after REAL runs (record-gate-result), never env vars.
        # This step runs last; anything not-run/not-recorded counts as FAIL.
        run: npm run gate:quality

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            docs/baseline/quality-report.json
            docs/baseline/a11y-baseline.json
            results/unit.json
            results/build.json
            results/e2e.json
            results/security-scan.json
          retention-days: 14

      # QR-005: the quality report is a REQUIRED blocking gate. It can only pass
      # when every required gate is a measured PASS for this commit — a silent
      # `continue-on-error` or an `always()`-then-ignore is forbidden here.
      - name: Enforce quality gate verdict (blocking)
        run: |
          node -e "const r=require('./docs/baseline/quality-report.json'); if(r.verdict!=='PASS'){console.error('::error::Quality report verdict is '+r.verdict+' — failing gates: '+(r.failedRequired||[]).join(','));process.exit(1)}; console.log('Quality verdict: PASS for '+r.commit)"

      - name: CI-012 Guard — Production Build Must Fail With DEMO_MODE Enabled
        env:
          DEMO_MODE: "true"
        run: |
          if npx next build; then
            echo "::error::Production build succeeded with DEMO_MODE=true — demo gate is broken"
            exit 1
          else
            echo "OK: production build correctly refuses DEMO_MODE=true"
          fi

  e2e-gate:
    runs-on: ubuntu-latest
    needs: audit-and-verify
    # CI-013: this job is no longer allowed to fail silently. `continue-on-error`
    # meant a broken user journey could merge as long as the unit tests passed.
    env:
      DEMO_MODE: "false"
      NEXT_PUBLIC_DEMO_MODE: "false"
      GATEWAY_MODE: internal_wallet
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'itrip_secure_password' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations & Seed
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Production Bundle
        env:
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: npm run build

      - name: Run E2E Golden Journeys (Desktop Chromium)
        run: npx playwright test tests/golden-journeys.spec.ts --project=chromium

      - name: Run E2E Golden Journeys (Mobile Chromium)
        run: npx playwright test tests/golden-journeys.spec.ts --project=mobile-chromium

      # QR-002: the e2e record (and its evidence upload) must travel with the
      # actual run — never a separately-injected status. The e2e-gate job owns
      # results/e2e.json; the quality report (audit-and-verify) validates it via
      # CI job artifacts, so a stale/missing record fails closed.
      - name: Record E2E outcome (real measured status)
        if: always()
        run: |
          node scripts/record-gate-result.mjs e2e ${{ job.status == 'success' && 'pass' || 'fail' }} -- "CI e2e-gate golden journeys"

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  concurrency-gate:
    runs-on: ubuntu-latest
    needs: audit-and-verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'itrip_secure_password' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations
        run: npx prisma migrate deploy

      - name: Execute High-Concurrency Stress Suites (CI-104)
        run: |
          npx vitest run src/domains/inventory/inventory-concurrency.test.ts src/domains/inventory/capture-release-race.test.ts src/domains/inventory/hold-race.test.ts

  recovery-and-fault-injection-gate:
    runs-on: ubuntu-latest
    needs: audit-and-verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'itrip_secure_password' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations
        run: npx prisma migrate deploy

      - name: Execute Worker & Saga Crash Recovery Suites (CI-105)
        run: |
          npx vitest run src/domains/events/worker-crash-recovery.test.ts src/domains/events/saga-idempotency.test.ts src/domains/events/saga-outbox-crash.test.ts
