name: Production Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://itrip_user:itrip_secure_password@localhost:5432/itrip_test_db
      AUTH_SECRET: production_audit_dummy_secret_32_chars_min
      ADMIN_PASSWORD: Admin@Firuzo2026!Secure
      USER_PASSWORD: User@Firuzo2026!Secure
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: itrip_secure_password
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Validate Prisma Database Migrations
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Execute Unit & Financial Invariant Tests
        run: npm run test:unit

      - name: Next.js Production Build
        env:
          DATABASE_URL: postgresql://itrip_user:itrip_secure_password@localhost:5432/itrip_test_db
          AUTH_SECRET: production_audit_dummy_secret_32_chars_min
          DEMO_MODE: "false"
        run: npm run build
