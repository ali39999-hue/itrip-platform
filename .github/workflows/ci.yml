name: Production Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Test-only credentials are injected via GitHub Actions secrets with CI-local
# fallbacks. Never commit real production credentials to this repository.
env:
  DATABASE_URL: postgresql://itrip_user:itrip_secure_password@localhost:5432/itrip_test_db
  AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci_only_dummy_secret_32_chars_min' }}
  ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'Admin@Firuzo2026!Secure' }}
  USER_PASSWORD: ${{ secrets.CI_USER_PASSWORD || 'User@Firuzo2026!Secure' }}
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ephemeral_ci_pg_pw' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets Scan (SEC-009 / CI-009)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Validate Prisma Database Migrations
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Schema Drift Check (CI-014)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Execute Unit & Financial Invariant Tests
        run: npm run test:unit

      - name: Next.js Production Build (demo disabled)
        env:
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: npm run build

      - name: CI-012 Guard — Production Build Must Fail With DEMO_MODE Enabled
        env:
          DEMO_MODE: "true"
        run: |
          if npx next build; then
            echo "::error::Production build succeeded with DEMO_MODE=true — demo gate is broken"
            exit 1
          else
            echo "OK: production build correctly refuses DEMO_MODE=true"
          fi

  e2e-gate:
    runs-on: ubuntu-latest
    needs: audit-and-verify
    env:
      DEMO_MODE: "false"
      NEXT_PUBLIC_DEMO_MODE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ephemeral_ci_pg_pw' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations & Seed
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Production Bundle
        env:
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: npm run build

      - name: Run E2E Golden Journeys (Desktop Chromium)
        run: npx playwright test tests/golden-journeys.spec.ts --project=chromium

      - name: Run E2E Golden Journeys (Mobile Chromium)
        run: npx playwright test tests/golden-journeys.spec.ts --project=mobile-chromium

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  concurrency-gate:
    runs-on: ubuntu-latest
    needs: audit-and-verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ephemeral_ci_pg_pw' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations
        run: npx prisma migrate deploy

      - name: Execute High-Concurrency Stress Suites (CI-104)
        run: |
          npx vitest run src/domains/inventory/inventory-concurrency.test.ts src/domains/inventory/capture-release-race.test.ts src/domains/inventory/hold-race.test.ts

  recovery-and-fault-injection-gate:
    runs-on: ubuntu-latest
    needs: audit-and-verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ephemeral_ci_pg_pw' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations
        run: npx prisma migrate deploy

      - name: Execute Worker & Saga Crash Recovery Suites (CI-105)
        run: |
          npx vitest run src/domains/events/worker-crash-recovery.test.ts src/domains/events/saga-idempotency.test.ts src/domains/events/saga-outbox-crash.test.ts
