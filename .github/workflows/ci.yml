name: Production Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Test-only credentials are injected via GitHub Actions secrets with CI-local
# fallbacks. Never commit real production credentials to this repository.
env:
  DATABASE_URL: postgresql://itrip_user:itrip_secure_password@localhost:5432/itrip_test_db
  AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci_only_dummy_secret_32_chars_min' }}
  ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'Admin@Firuzo2026!Secure' }}
  USER_PASSWORD: ${{ secrets.CI_USER_PASSWORD || 'User@Firuzo2026!Secure' }}
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: itrip_secure_password
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Validate Prisma Database Migrations
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Execute Unit & Financial Invariant Tests
        run: npm run test:unit

      - name: Next.js Production Build
        env:
          DEMO_MODE: "false"
        run: npm run build

  e2e-gate:
    runs-on: ubuntu-latest
    needs: audit-and-verify
    continue-on-error: true
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: itrip_secure_password
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations & Seed
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Production Bundle
        env:
          DEMO_MODE: "false"
        run: npm run build

      - name: Run E2E Golden Journeys (Chromium)
        run: npx playwright test tests/golden-journeys.spec.ts --project=chromium

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
