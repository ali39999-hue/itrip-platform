name: Enterprise Release Full-Test Gate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://itrip_user:itrip_secure_password@localhost:5432/itrip_test_db
  AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'development_dummy_auth_key_32chars' }}
  ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'Admin@Firuzo2026!Secure' }}
  USER_PASSWORD: ${{ secrets.CI_USER_PASSWORD || 'User@Firuzo2026!Secure' }}
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  full-release-certification:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      GATEWAY_MODE: internal_wallet
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itrip_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'itrip_secure_password' }}
          POSTGRES_DB: itrip_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Architecture Guardrails
        run: npm run lint

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Deploy Migrations & Seed
        run: |
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Verify Zero Schema Drift (CI-106)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Security Scan Gate (SEC-106)
        run: node scripts/security-scan.mjs

      - name: I18N Parity Gate (I18N-102)
        run: node scripts/i18n-completeness-gate.mjs

      - name: Full Unit & Integration Test Suite
        run: npm run test:unit

      - name: Install Playwright & Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Production Release Bundle
        env:
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: npm run build

      - name: Run Complete E2E Matrix (Desktop & Mobile)
        continue-on-error: true
        env:
          DEMO_MODE: "false"
          NEXT_PUBLIC_DEMO_MODE: "false"
          GATEWAY_MODE: internal_wallet
        run: npx playwright test tests/golden-journeys.spec.ts

      - name: Regenerate and Audit Feature Reality Matrix (BASE-102)
        run: node scripts/generate-reality-matrix.mjs
